# VobiTour – PostgreSQL + PostGIS + pgRouting
# Start:  docker compose up -d
# Shell:  docker compose exec db psql -U $POSTGRES_USER -d $POSTGRES_DB
# Reset:  docker compose down -v   (löscht das Volume = leere DB)

services:
  db:
    # feste Version: PostgreSQL 17 + PostGIS 3.5 + pgRouting 4.0 (kein "latest")
    image: pgrouting/pgrouting:17-3.5-4.0
    container_name: vobitour-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro          # Migrationen im Container sichtbar (psql -f /db/migrations/...)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
